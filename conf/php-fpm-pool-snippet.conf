; ============================================================================
; php-fpm-pool-snippet.conf — snippet tinh chỉnh pool PHP-FPM cho DirectAdmin
;
; CÁCH DÙNG
;   1) Toàn cục, bền qua rebuild:
;        /usr/local/directadmin/data/templates/custom/php-fpm.conf.custom1
;      Dán nội dung phần A vào file trên, rồi:
;        da build rewrite_confs
;        systemctl restart php-fpm83
;
;   2) Theo domain/user:
;      Admin Level -> Custom Httpd Configurations -> domain -> php-fpm83
;      Dán phần A vào ô CUSTOM1, lưu, rồi rewrite_confs + restart.
;
;   3) Chỉnh trực tiếp file pool (sẽ bị ghi đè khi rewrite_confs):
;        /usr/local/directadmin/data/users/USER/php/php-fpm83.conf
;
; LƯU Ý
;   - pm.max_children là trần đồng thời của MỘT pool (một user).
;   - DirectAdmin không có giới hạn tổng worker toàn server.
;   - Đặt max_children theo RAM thực tế, không theo cảm tính.
;   - request_terminate_timeout phải lớn hơn max_execution_time của app.
; ============================================================================

; --- A. Token DirectAdmin: đặt số worker tối đa -----------------------------
; Bỏ dấu ; ở dòng dưới để áp dụng. Đây là token của template DA, không phải
; directive PHP-FPM thuần.
; |?MAX_CHILDREN=8|

; --- B. Directive PHP-FPM thuần (dán sau token nếu cần) ---------------------
; pm = ondemand
; pm.max_children = 8
; pm.process_idle_timeout = 30
; pm.max_requests = 500
;
; request_terminate_timeout = 60s
; request_slowlog_timeout = 5s
; slowlog = /home/USER/.php/php-fpm-slow.log
;
; catch_workers_output = yes
;
; ; Không bật status_path ra Internet. Chỉ dùng nội bộ:
; ; pm.status_path = /fpm-status

; --- C. Ghi chú chọn chế độ -------------------------------------------------
; Shared hosting nhiều tài khoản, ít traffic: giữ ondemand.
; Server vài site traffic đều: có thể dùng dynamic, nhưng phải tính
; start_servers/min_spare_servers/max_spare_servers theo RAM.
; static: chỉ khi kiểm soát hoàn toàn tải và đã tính đủ RAM.
