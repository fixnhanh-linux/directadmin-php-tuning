; ============================================================================
; 99-opcache-tuning.ini — cấu hình OPcache tham khảo
; Đặt tại: /usr/local/php83/lib/php.conf.d/99-opcache-tuning.ini
;
; Hoặc dùng cơ chế CustomBuild (áp dụng cho mọi phiên bản):
;   /usr/local/directadmin/custombuild/custom/opcache/opcache.ini
;   sau đó: da build rewrite_confs   (hoặc da build opcache)
;
; Lưu ý:
;   - OPcache dùng shared memory theo từng FPM master.
;   - Nhiều phiên bản PHP = nhiều vùng OPcache = nhiều RAM.
;   - Isolated FPM = mỗi user một master; giảm mạnh dung lượng OPcache.
;   - Không khai báo zend_extension=opcache.so nếu extension đã được load;
;     load trùng có thể gây warning hoặc lỗi.
; ============================================================================

opcache.enable = 1

; CLI thường không cần OPcache; bật sẽ tốn thêm bộ nhớ cho cron/queue.
opcache.enable_cli = 0

; Bộ nhớ bytecode (MB). Đo used_memory/free_memory trước khi tăng.
; 128 MB: vài site nhỏ | 256 MB: 20–100 site | 512 MB: nhiều plugin/Woo lớn.
opcache.memory_consumption = 256

; Bộ nhớ cho interned strings (MB).
opcache.interned_strings_buffer = 32

; Số file tối đa. PHP làm tròn lên mốc nguyên tố:
; 223, 463, 983, 1979, 3907, 7963, 16229, 32531, 65407, 130987...
opcache.max_accelerated_files = 32531

; % bộ nhớ lãng phí trước khi OPcache tự restart.
opcache.max_wasted_percentage = 10

; Shared hosting: giữ 1 để user sửa file là thấy thay đổi.
; Immutable deploy: có thể đặt 0, nhưng phải reset cache khi deploy.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; Giữ comment để annotation/Doctrine và một số plugin hoạt động đúng.
; Không đặt 0 trừ khi bạn chắc chắn không dùng annotation.
opcache.save_comments = 1

; JIT thường không giúp WordPress/Woo (I/O-bound) và làm tăng RAM.
; Chỉ bật sau khi benchmark trên staging.
opcache.jit = off
opcache.jit_buffer_size = 0

; Tùy chọn bảo mật: giới hạn opcache_reset()/opcache_get_status() qua API web.
; Nếu bật, phải đặt tiền tố đường dẫn được phép, ví dụ:
;   opcache.restrict_api = /home/USER/domains/example.com/public_html/
; Đặt "1" sẽ chặn mọi đường dẫn (không khớp tiền tố), thường dùng để tắt API web.
; opcache.restrict_api = 1
