; ============================================================================
; redis-session.ini — session Redis cho DirectAdmin (mẫu tham khảo)
;
; Không đặt file này vào php.conf.d toàn cục nếu mỗi user dùng socket/DB khác
; nhau. Nên đặt trong pool của user hoặc trong CUSTOM2.
;
; Điều kiện:
;   - Đã cài redis server và php_redis extension.
;   - User đã bật Redis trong package/user (redis=ON).
;   - Socket tồn tại: /home/USER/.redis/redis.sock
;
; Kiểm tra:
;   redis-cli -s /home/USER/.redis/redis.sock ping
;   redis-cli -s /home/USER/.redis/redis.sock info memory
; ============================================================================

; --- Cách 1: socket Unix (khuyến nghị trên cùng máy) ------------------------
; session.save_handler = redis
; session.save_path = "unix:///home/USER/.redis/redis.sock?database=2"

; --- Cách 2: TCP nội bộ (chỉ khi Redis bind 127.0.0.1 và có mật khẩu) -------
; session.save_handler = redis
; session.save_path = "tcp://127.0.0.1:6379?auth=MAT_KHAU_MANH&database=2"

; Khóa session để tránh race condition khi nhiều request cùng ghi.
; Có thể tăng độ trễ; chỉ bật nếu ứng dụng cần.
; redis.session.locking_enabled = 1
; redis.session.lock_expire = 60
; redis.session.lock_retries = 10

; --- Cảnh báo bảo mật -------------------------------------------------------
; - Không mở Redis ra Internet.
; - Không dùng allkeys-lru cho instance chứa session: Redis có thể evict
;   session và làm user bị đăng xuất.
; - Tách DB/instance cho cache và session nếu có thể.
; - Dùng prefix khác nhau cho từng site:
;     WordPress: define('WP_REDIS_PREFIX', 'wp_example_');
;     Laravel:   REDIS_CACHE_DB / REDIS_DB riêng.
