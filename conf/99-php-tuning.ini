; ============================================================================
; 99-php-tuning.ini — cấu hình PHP tham khảo cho DirectAdmin/CustomBuild
; Đặt tại: /usr/local/php83/lib/php.conf.d/99-php-tuning.ini
; Thay 83 bằng phiên bản PHP thực tế (82, 83, 84, 85...).
;
; Nguyên tắc:
;   - Đây là điểm khởi đầu, không phải cấu hình vạn năng.
;   - Đo baseline trước khi áp dụng (xem README chương 2).
;   - Không sửa 10-directadmin.ini hay 50-webapps.ini; CustomBuild sẽ ghi đè.
;   - Sau khi sửa: systemctl restart php-fpm83
; ============================================================================

; --- Bộ nhớ và thời gian -----------------------------------------------------
; memory_limit là trần mỗi request, không phải RAM thực tế của worker.
; WordPress thường 256M; WooCommerce nhiều plugin 512M; Laravel 256–512M.
; Không đặt -1 trên production.
memory_limit = 256M

; max_execution_time tính theo CPU time, không phải wall clock.
; Request chờ DB/API lâu có thể không bị giới hạn này kill.
; Dùng request_terminate_timeout của FPM cho giới hạn wall clock.
max_execution_time = 60
max_input_time = 60

; --- Form và upload ----------------------------------------------------------
; max_input_vars mặc định 1000; tăng vừa đủ cho form lớn.
; Đặt quá cao (100k) tạo bề mặt DoS.
max_input_vars = 5000

; Chuỗi giới hạn phải đồng bộ:
;   nginx client_max_body_size >= post_max_size >= upload_max_filesize
post_max_size = 80M
upload_max_filesize = 64M
max_file_uploads = 20

; --- Đường dẫn ---------------------------------------------------------------
; Cache realpath/stat theo từng process. Tăng cho site nhiều plugin/file.
; Không tăng quá cao vì mỗi worker đều tốn thêm RAM.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; --- Lỗi ---------------------------------------------------------------------
; Không lộ phiên bản PHP và lỗi nội bộ ra trình duyệt.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; Ghi log đầy đủ để debug; có thể bỏ E_DEPRECATED nếu log quá nhiễu.
error_reporting = E_ALL & ~E_DEPRECATED

; Đặt error_log riêng cho từng user trong pool, ví dụ:
;   php_admin_value[error_log] = /home/USER/.php/php-error.log
;   php_admin_flag[log_errors] = on
; Không đặt error_log toàn cục vào một file dùng chung.

; --- Output ------------------------------------------------------------------
output_buffering = 4096

; Để nginx/CDN nén; bật zlib trong PHP thường tốn CPU và chồng chéo.
zlib.output_compression = Off

; --- Session -----------------------------------------------------------------
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Với file session, để gc mặc định hoặc dọn bằng cron.
; Với Redis session, PHP không cần garbage collector.
; session.gc_probability = 0

; --- Khác --------------------------------------------------------------------
allow_url_include = Off
date.timezone = Asia/Ho_Chi_Minh

; Không khai báo disable_functions ở đây nếu DirectAdmin đã bật secure_php.
; Thêm bừa có thể làm hỏng WP-CLI, plugin, cron. Xem README mục 8.7.
