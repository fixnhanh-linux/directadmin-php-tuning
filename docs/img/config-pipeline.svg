<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="604" viewBox="0 0 1220 604" role="img" aria-labelledby="t d">
  <title id="t">Cấu hình DirectAdmin: nguồn và kết quả</title>
  <desc id="d">Nguồn được sửa, lệnh da build biến đổi, kết quả sinh ra và có thể bị ghi đè.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
<marker id="ar-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker>
<marker id="ar-web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
<marker id="ar-php" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B5CF6"/></marker>
<marker id="ar-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10B981"/></marker>
<marker id="ar-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EAB308"/></marker>
<marker id="ar-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker>
<marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22C55E"/></marker>
<marker id="ar-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
<marker id="ar-cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/></marker>
  </defs>

  <style>
    text { font-family: "Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #0b1220; }
    .sub   { font-size: 13.5px; fill: #64748b; }
    .n     { font-size: 16px; font-weight: 650; }
    .s     { font-size: 12.5px; fill: #64748b; }
    .mono  { font-family: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size: 13px; }
    .band  { font-size: 13px; font-weight: 700; letter-spacing: .2px; }

    .flow {
      fill: none; stroke-width: 2.8; stroke-linecap: round;
      stroke-dasharray: 2 12;
      animation: flow 1.15s linear infinite;
    }
    @keyframes flow { to { stroke-dashoffset: -28; } }

    .dashflow {
      fill: none; stroke-width: 2.2; stroke-dasharray: 8 7;
      animation: dashflow 1.7s linear infinite;
    }
    @keyframes dashflow { to { stroke-dashoffset: -30; } }

    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .95 } }

    @media (prefers-reduced-motion: reduce) {
      .flow, .dashflow, .pulse { animation: none; }
    }
  </style>

  <rect x="0" y="0" width="1220" height="604" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1219" height="603" rx="18" fill="none" stroke="#e2e8f0"/>

<text x="36" y="52" class="title">Cấu hình: chỗ nào được sửa, chỗ nào bị ghi đè</text>
<text x="36" y="80" class="sub">Sửa cột xanh thì bền qua rebuild · sửa cột đỏ thì lần build sau sẽ mất</text>
<text x="36" y="118" class="band" fill="#15803d">● NGUỒN — sửa ở đây · bền qua rebuild</text>
<text x="500" y="118" class="band" fill="#0e7490">● LỆNH</text>
<text x="960" y="118" class="band" fill="#b91c1c">● KẾT QUẢ — đừng sửa</text>
<rect x="30" y="136" width="210" height="60" rx="13" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="135.0" y="160.0" text-anchor="middle" class="mono" fill="#14532D">php.conf.d/99-*.ini</text>
<text x="135.0" y="179.5" text-anchor="middle" class="s" fill="#14532D" style="font-size:12.5px">drop-in</text>
<rect x="262" y="136" width="210" height="60" rx="13" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="367.0" y="160.0" text-anchor="middle" class="mono" fill="#14532D">options.conf</text>
<text x="367.0" y="179.5" text-anchor="middle" class="s" fill="#14532D" style="font-size:12.5px">bản · handler</text>
<rect x="494" y="136" width="210" height="60" rx="13" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="599.0" y="160.0" text-anchor="middle" class="mono" fill="#14532D">templates/custom/</text>
<text x="599.0" y="179.5" text-anchor="middle" class="s" fill="#14532D" style="font-size:12.5px">template riêng</text>
<rect x="726" y="136" width="210" height="60" rx="13" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="831.0" y="160.0" text-anchor="middle" class="mono" fill="#14532D">CUSTOM1 / CUSTOM2</text>
<text x="831.0" y="179.5" text-anchor="middle" class="s" fill="#14532D" style="font-size:12.5px">giao diện DA</text>
<rect x="958" y="136" width="210" height="60" rx="13" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="1063.0" y="160.0" text-anchor="middle" class="mono" fill="#14532D">custom/opcache/</text>
<text x="1063.0" y="179.5" text-anchor="middle" class="s" fill="#14532D" style="font-size:12.5px">opcache.ini</text>
<rect x="196" y="276" width="236" height="64" rx="13" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8" filter="url(#shadow)"/>
<text x="314.0" y="302.0" text-anchor="middle" class="mono" fill="#164E63">da build php</text>
<text x="314.0" y="321.5" text-anchor="middle" class="s" fill="#164E63" style="font-size:12.5px">biên dịch · ghi php.ini</text>
<rect x="486" y="276" width="264" height="64" rx="13" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8" filter="url(#shadow)"/>
<text x="618.0" y="302.0" text-anchor="middle" class="mono" fill="#164E63">da build rewrite_confs</text>
<text x="618.0" y="321.5" text-anchor="middle" class="s" fill="#164E63" style="font-size:12.5px">sinh lại vhost và pool</text>
<rect x="806" y="269" width="230" height="78" rx="13" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8" filter="url(#shadow)"/>
<text x="921.0" y="292.0" text-anchor="middle" class="mono" fill="#164E63">da build opcache</text>
<text x="921.0" y="311.5" text-anchor="middle" class="s" fill="#164E63" style="font-size:12.5px">cấu hình OPcache</text>
<text x="921.0" y="331.0" text-anchor="middle" class="s" fill="#164E63" style="font-size:12.5px">→ 10-directadmin.ini</text>
<rect x="48" y="440" width="250" height="64" rx="13" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8" filter="url(#shadow)"/>
<text x="173.0" y="466.0" text-anchor="middle" class="mono" fill="#7F1D1D">php.ini</text>
<text x="173.0" y="485.5" text-anchor="middle" class="s" fill="#7F1D1D" style="font-size:12.5px">file chính</text>
<rect x="320" y="440" width="250" height="64" rx="13" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8" filter="url(#shadow)"/>
<text x="445.0" y="466.0" text-anchor="middle" class="mono" fill="#7F1D1D">10-directadmin.ini</text>
<text x="445.0" y="485.5" text-anchor="middle" class="s" fill="#7F1D1D" style="font-size:12.5px">CustomBuild sinh</text>
<rect x="600" y="440" width="250" height="64" rx="13" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8" filter="url(#shadow)"/>
<text x="725.0" y="466.0" text-anchor="middle" class="mono" fill="#7F1D1D">php-fpm83.conf</text>
<text x="725.0" y="485.5" text-anchor="middle" class="s" fill="#7F1D1D" style="font-size:12.5px">pool theo user</text>
<rect x="880" y="440" width="300" height="64" rx="13" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8" filter="url(#shadow)"/>
<text x="1030.0" y="466.0" text-anchor="middle" class="mono" fill="#7F1D1D">vhost nginx / httpd</text>
<text x="1030.0" y="485.5" text-anchor="middle" class="s" fill="#7F1D1D" style="font-size:12.5px">cấu hình web</text>
