<svg xmlns="http://www.w3.org/2000/svg" width="940" height="524" viewBox="0 0 940 524" role="img" aria-labelledby="t d">
  <title id="t">Chuỗi timeout lồng nhau</title>
  <desc id="d">nginx, Apache, PHP-FPM và PHP với các mốc thời gian lồng vào nhau.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
<marker id="ar-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker>
<marker id="ar-web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
<marker id="ar-php" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B5CF6"/></marker>
<marker id="ar-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10B981"/></marker>
<marker id="ar-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EAB308"/></marker>
<marker id="ar-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker>
<marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22C55E"/></marker>
<marker id="ar-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
<marker id="ar-cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/></marker>
  </defs>

  <style>
    text { font-family: "Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #0b1220; }
    .sub   { font-size: 13.5px; fill: #64748b; }
    .n     { font-size: 16px; font-weight: 650; }
    .s     { font-size: 12.5px; fill: #64748b; }
    .mono  { font-family: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size: 13px; }
    .band  { font-size: 13px; font-weight: 700; letter-spacing: .2px; }

    .flow {
      fill: none; stroke-width: 2.8; stroke-linecap: round;
      stroke-dasharray: 2 12;
      animation: flow 1.15s linear infinite;
    }
    @keyframes flow { to { stroke-dashoffset: -28; } }

    .dashflow {
      fill: none; stroke-width: 2.2; stroke-dasharray: 8 7;
      animation: dashflow 1.7s linear infinite;
    }
    @keyframes dashflow { to { stroke-dashoffset: -30; } }

    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .95 } }

    @media (prefers-reduced-motion: reduce) {
      .flow, .dashflow, .pulse { animation: none; }
    }
  </style>

  <rect x="0" y="0" width="940" height="524" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="939" height="523" rx="18" fill="none" stroke="#e2e8f0"/>

<text x="36" y="52" class="title">Timeout lồng nhau: tầng ngoài phải chậm hơn</text>
<text x="36" y="80" class="sub">Nếu nginx cắt trước, người dùng thấy 504 còn PHP vẫn chạy và vẫn chiếm worker</text>
<rect x="40" y="112" width="860" height="336" rx="16" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="2" stroke-dasharray="9 7" class="dashflow" style="animation-duration:2.4s"/>
<text x="58" y="139" class="band" fill="#3B82F6">nginx</text>
<text x="882" y="139" text-anchor="end" class="mono" fill="#3B82F6" style="font-size:11.5px">proxy_read_timeout 65s</text>
<rect x="80" y="150" width="780" height="260" rx="16" fill="#ECFEFF" fill-opacity="0.5" stroke="#0891B2" stroke-width="2" stroke-dasharray="9 7" class="dashflow" style="animation-duration:2.9s"/>
<text x="98" y="177" class="band" fill="#0891B2">Apache</text>
<text x="842" y="177" text-anchor="end" class="mono" fill="#0891B2" style="font-size:11.5px">ProxyTimeout 65s</text>
<rect x="120" y="188" width="700" height="184" rx="16" fill="#F5F3FF" fill-opacity="0.5" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="9 7" class="dashflow" style="animation-duration:3.4s"/>
<text x="138" y="215" class="band" fill="#8B5CF6">PHP-FPM</text>
<text x="802" y="215" text-anchor="end" class="mono" fill="#8B5CF6" style="font-size:11.5px">request_terminate_timeout 60s</text>
<rect x="160" y="226" width="620" height="108" rx="16" fill="#FEFCE8" fill-opacity="0.5" stroke="#EAB308" stroke-width="2" stroke-dasharray="9 7" class="dashflow" style="animation-duration:3.9s"/>
<text x="178" y="253" class="band" fill="#EAB308">PHP</text>
<text x="762" y="253" text-anchor="end" class="mono" fill="#EAB308" style="font-size:11.5px">max_execution_time 60s</text>
<rect x="300" y="264" width="340" height="54" rx="13" fill="#ffffff" stroke="#22C55E" stroke-width="2" filter="url(#shadow)"/>
<text x="470" y="288" text-anchor="middle" class="n" fill="#14532D">Ứng dụng</text>
<text x="470" y="307" text-anchor="middle" class="s" style="font-size:11.5px">query · render · gọi API</text>
<circle r="3.8" fill="#0F172A" opacity="0.5"><animateMotion dur="10.0s" repeatCount="indefinite" path="M62 112 H878 V448 H62 Z"/></circle>
<circle r="3.8" fill="#0F172A" opacity="0.5"><animateMotion dur="11.8s" repeatCount="indefinite" path="M102 150 H838 V410 H102 Z"/></circle>
<circle r="3.8" fill="#0F172A" opacity="0.5"><animateMotion dur="13.6s" repeatCount="indefinite" path="M142 188 H798 V372 H142 Z"/></circle>
<circle r="3.8" fill="#0F172A" opacity="0.5"><animateMotion dur="15.4s" repeatCount="indefinite" path="M182 226 H758 V334 H182 Z"/></circle>

  <g>
    <rect x="40" y="466" width="860" height="34" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="58" y="488" class="s" style="font-size:12px">65s &gt; 60s &gt; thời gian xử lý thật — mỗi lớp rộng hơn lớp trong ít nhất 5 giây để tránh cắt oan.</text>
  </g>
</svg>