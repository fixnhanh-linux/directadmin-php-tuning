<path d="M570 174 L570 212" class="flow" stroke="#3B82F6" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#3B82F6" filter="url(#glow)"><animateMotion dur="1.9s" begin="0.00s" repeatCount="indefinite" path="M570 174 L570 212"/></circle>
