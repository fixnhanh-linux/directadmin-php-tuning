<rect x="252" y="416" width="54" height="34" rx="9" fill="#ffffff" stroke="#22C55E" stroke-width="1.2"/>
<circle cx="279" cy="433" r="5.6" fill="#22C55E" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.8400000000000001s" repeatCount="indefinite"/></circle>
<text x="180" y="478" text-anchor="middle" class="s">ondemand · 0 worker khi rảnh</text>
<text x="180" y="504" text-anchor="middle" class="s" style="font-size:11px">/usr/local/php83/sockets/USER.sock</text>
<rect x="425" y="342" width="300" height="190" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8" filter="url(#shadow)"/>
<text x="575" y="374" text-anchor="middle" class="n" fill="#4C1D95">Pool bob</text>
<text x="575" y="398" text-anchor="middle" class="s">max_children = 4</text>
