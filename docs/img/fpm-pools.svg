<text x="970" y="478" text-anchor="middle" class="s" fill="#B91C1C">+ 8 worker · đang quá tải</text>
<text x="970" y="504" text-anchor="middle" class="s" style="font-size:11px">/usr/local/php83/sockets/USER.sock</text>
<path d="M470 284 C470 312 240 312 180 338" fill="none" stroke="#EAB308" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-cache)"/>
<path d="M470 284 C470 312 240 312 180 338" class="flow" stroke="#EAB308" style="animation-delay:-0.0s"/>
