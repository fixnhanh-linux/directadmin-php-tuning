<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="448" viewBox="0 0 1140 448" role="img" aria-labelledby="t d">
  <title id="t">Luồng request trên DirectAdmin</title>
  <desc id="d">Người dùng, CDN, nginx, Apache, PHP-FPM, MySQL và Redis với mũi tên chuyển động theo chiều request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
<marker id="ar-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker>
<marker id="ar-web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
<marker id="ar-php" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B5CF6"/></marker>
<marker id="ar-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10B981"/></marker>
<marker id="ar-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EAB308"/></marker>
<marker id="ar-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker>
<marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22C55E"/></marker>
<marker id="ar-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
<marker id="ar-cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/></marker>
  </defs>

  <style>
    text { font-family: "Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #0b1220; }
    .sub   { font-size: 13.5px; fill: #64748b; }
    .n     { font-size: 16px; font-weight: 650; }
    .s     { font-size: 12.5px; fill: #64748b; }
    .mono  { font-family: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size: 13px; }
    .band  { font-size: 13px; font-weight: 700; letter-spacing: .2px; }

    .flow {
      fill: none; stroke-width: 2.8; stroke-linecap: round;
      stroke-dasharray: 2 12;
      animation: flow 1.15s linear infinite;
    }
    @keyframes flow { to { stroke-dashoffset: -28; } }

    .dashflow {
      fill: none; stroke-width: 2.2; stroke-dasharray: 8 7;
      animation: dashflow 1.7s linear infinite;
    }
    @keyframes dashflow { to { stroke-dashoffset: -30; } }

    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .95 } }

    @media (prefers-reduced-motion: reduce) {
      .flow, .dashflow, .pulse { animation: none; }
    }
  </style>

  <rect x="0" y="0" width="1140" height="448" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1139" height="447" rx="18" fill="none" stroke="#e2e8f0"/>

<text x="36" y="52" class="title">Luồng request trên DirectAdmin</text>
<text x="36" y="80" class="sub">Mũi tên chuyển động theo chiều request · màu là vai trò của từng tầng</text>
<rect x="36" y="172" width="140" height="92" rx="13" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.8" filter="url(#shadow)"/>
<text x="106.0" y="212.0" text-anchor="middle" class="n" fill="#7C2D12">Người dùng</text>
<text x="106.0" y="231.5" text-anchor="middle" class="s" fill="#7C2D12" style="font-size:12.5px">trình duyệt</text>
<rect x="216" y="172" width="140" height="92" rx="13" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.8" filter="url(#shadow)"/>
<text x="286.0" y="212.0" text-anchor="middle" class="n" fill="#7C2D12">CDN / WAF</text>
<text x="286.0" y="231.5" text-anchor="middle" class="s" fill="#7C2D12" style="font-size:12.5px">cache · lọc bot</text>
<rect x="396" y="172" width="150" height="92" rx="13" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8" filter="url(#shadow)"/>
<text x="471.0" y="212.0" text-anchor="middle" class="n" fill="#1E3A8A">nginx</text>
<text x="471.0" y="231.5" text-anchor="middle" class="s" fill="#1E3A8A" style="font-size:12.5px">static · 65s</text>
<rect x="586" y="172" width="150" height="92" rx="13" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8" filter="url(#shadow)"/>
<text x="661.0" y="212.0" text-anchor="middle" class="n" fill="#1E3A8A">Apache</text>
<text x="661.0" y="231.5" text-anchor="middle" class="s" fill="#1E3A8A" style="font-size:12.5px">nginx_apache · 65s</text>
<rect x="776" y="172" width="160" height="92" rx="13" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8" filter="url(#shadow)"/>
<text x="856.0" y="212.0" text-anchor="middle" class="n" fill="#4C1D95">PHP-FPM</text>
<text x="856.0" y="231.5" text-anchor="middle" class="s" fill="#4C1D95" style="font-size:12.5px">pool USER · 60s</text>
<path d="M976 123 a67.0 15 0 0 1 134 0 v66 a67.0 15 0 0 1 -134 0 z" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8" filter="url(#shadow)"/>
<ellipse cx="1043.0" cy="123" rx="67.0" ry="15" fill="#ffffff" fill-opacity="0.55" stroke="#10B981" stroke-width="1.8"/>
<text x="1043.0" y="158.0" text-anchor="middle" class="n" fill="#064E3B">MySQL</text>
<text x="1043.0" y="178.0" text-anchor="middle" class="s" fill="#064E3B">query</text>
<path d="M976 265 a67.0 15 0 0 1 134 0 v66 a67.0 15 0 0 1 -134 0 z" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8" filter="url(#shadow)"/>
<ellipse cx="1043.0" cy="265" rx="67.0" ry="15" fill="#ffffff" fill-opacity="0.55" stroke="#10B981" stroke-width="1.8"/>
<text x="1043.0" y="300.0" text-anchor="middle" class="n" fill="#064E3B">Redis</text>
<text x="1043.0" y="320.0" text-anchor="middle" class="s" fill="#064E3B">cache</text>
<rect x="396" y="342" width="150" height="76" rx="13" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8" filter="url(#shadow)"/>
<text x="471.0" y="374.0" text-anchor="middle" class="n" fill="#064E3B">NVMe</text>
<text x="471.0" y="393.5" text-anchor="middle" class="s" fill="#064E3B" style="font-size:12.5px">file tĩnh</text>
<path d="M176 218 L212 218" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-client)"/>
<path d="M176 218 L212 218" class="flow" stroke="#F59E0B" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#F59E0B" filter="url(#glow)"><animateMotion dur="2.0s" begin="0.00s" repeatCount="indefinite" path="M176 218 L212 218"/></circle>
<path d="M356 218 L392 218" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-client)"/>
<path d="M356 218 L392 218" class="flow" stroke="#F59E0B" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#F59E0B" filter="url(#glow)"><animateMotion dur="2.0s" begin="0.25s" repeatCount="indefinite" path="M356 218 L392 218"/></circle>
<path d="M546 218 L582 218" fill="none" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-web)"/>
<path d="M546 218 L582 218" class="flow" stroke="#3B82F6" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#3B82F6" filter="url(#glow)"><animateMotion dur="2.1s" begin="0.10s" repeatCount="indefinite" path="M546 218 L582 218"/></circle>
<path d="M736 218 L772 218" fill="none" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-web)"/>
<path d="M736 218 L772 218" class="flow" stroke="#3B82F6" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#3B82F6" filter="url(#glow)"><animateMotion dur="2.1s" begin="0.45s" repeatCount="indefinite" path="M736 218 L772 218"/></circle>
<path d="M936 204 C962 204 962 150 972 150" fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-php)"/>
<path d="M936 204 C962 204 962 150 972 150" class="flow" stroke="#8B5CF6" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#8B5CF6" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.15s" repeatCount="indefinite" path="M936 204 C962 204 962 150 972 150"/></circle>
<path d="M936 232 C962 232 962 286 972 286" fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="2" marker-end="url(#ar-php)"/>
<path d="M936 232 C962 232 962 286 972 286" class="flow" stroke="#8B5CF6" style="animation-delay:-0.0s"/>
<circle r="4.4" fill="#8B5CF6" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.85s" repeatCount="indefinite" path="M936 232 C962 232 962 286 972 286"/></circle>
<path d="M471 264 L471 338" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ar-data)"/>
<path d="M471 264 L471 338" class="dashflow" stroke="#10B981" opacity="0.9"/>
<text x="483" y="306" text-anchor="start" fill="#0f766e" style="font-size:12px;font-weight:600" class="">file tĩnh</text>

  <g>
    <rect x="36" y="352" width="330" height="62" rx="13" fill="#FFFFFF" stroke="#e2e8f0"/>
    <circle cx="58" cy="374" r="4.4" fill="#3B82F6" filter="url(#glow)"/>
    <text x="72" y="378" class="s" style="font-size:12px">gói tin di chuyển theo chiều request</text>
    <line x1="58" y1="396" x2="94" y2="396" stroke="#10B981" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="104" y="400" class="s" style="font-size:12px">nét đứt = không đi qua PHP</text>
  </g>
</svg>